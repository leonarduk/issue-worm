name: Release

# Fixes #193: without this workflow, GitHub releases were cut with no
# assets attached, so version_checker.py's self-update check always failed
# with "Unable to check for an issue-worm update: GitHub release vX.Y.Z has
# no compatible issue_worm-X.Y.Z-py3-none-any.whl asset". Modeled on the
# working pattern in the sibling repos leonarduk/cicaid and
# leonarduk/cicaid-pro, minus their wiki-update step (this repo has no
# wiki quick-start page to keep in sync).

on:
  push:
    tags:
      # Full vX.Y.Z only - NOT "v*". The floating action tag moved by the
      # last step below (v1) must never cut a release of its own: a "v1"
      # GitHub Release would become releases/latest, which is exactly what
      # version_checker.py polls, and every free-engine user would be told
      # to "upgrade" to it.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  pull-requests: write

# Serialise releases: two cut close together would otherwise race on the
# force-push of the floating v1 tag in the last step.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed by setuptools-scm to derive version from git tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Fail loudly, before anything is published, if setuptools-scm derived
      # the version from anything but this tag - e.g. the floating v1 tag,
      # should a future setuptools-scm stop honouring pyproject.toml's
      # describe_command.
      - name: Check the wheel version matches the tag
        run: |
          expected="dist/issue_worm-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$expected" ]; then
            echo "::error::Expected $expected but built: $(ls dist)"
            exit 1
          fi

      # Publish the installable artifacts before the best-effort README
      # update below. A README-update failure must not leave a published
      # release without the wheel advertised by the updater.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            echo "Release already exists; uploading artifacts."
            # A previous attempt may have uploaded only some assets before failing.
            # Replace those assets so rerunning the workflow remains safe.
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

      # This release already IS the new version, so issue-worm-pro doesn't
      # need to wait for its next scheduled poll to notice it -- point its
      # update-dependencies.yml at it directly. That workflow always checks
      # its full matrix (issue-worm, cicaid-devtools-pro, ollama-tools) on
      # workflow_dispatch, and its cicaid-devtools pin is deliberately only
      # ever moved via the issue-worm leg (see its update_dependency_pins.py),
      # so no per-dependency input is needed here. Needs a cross-repo PAT
      # with Actions:write on issue-worm-pro (github.token only reaches this
      # repo); DISPATCH_TOKEN is a repo secret here, not something a release
      # can set itself.
      - name: Trigger dependency update in issue-worm-pro
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DISPATCH_TOKEN is not set; skipping issue-worm-pro dependency-update dispatch. Add a fine-grained PAT with Actions:write on leonarduk/issue-worm-pro as the DISPATCH_TOKEN repo secret."
            exit 0
          fi
          # Best-effort: the release is already published by this point, so a
          # dispatch failure (bad token scope, workflow renamed/removed in
          # issue-worm-pro) must not turn a successful release red. The next
          # scheduled poll there still catches this release either way.
          gh workflow run update-dependencies.yml --repo leonarduk/issue-worm-pro || \
            echo "::warning::Could not dispatch update-dependencies.yml in leonarduk/issue-worm-pro — it will pick up this release on its next scheduled run instead."

      - name: Update README to this release's version
        run: python scripts/bump_readme_version.py "${{ github.ref_name }}"

      - name: Push README update to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet README.md; then
            echo "README.md unchanged; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README install command to ${{ github.ref_name }}"

          # Strategy 1: PR-based merge (works with branch protection if
          # repo settings allow Actions to create PRs).
          BRANCH="readme-bump-${GITHUB_REF_NAME#v}"
          git checkout -b "$BRANCH"
          git push --force origin "$BRANCH"

          if PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update README install command to ${{ github.ref_name }}" \
            --body "Automated version bump triggered by release ${{ github.ref_name }}." 2>/dev/null); then
            echo "Created $PR_URL"
            gh pr merge "$PR_URL" --merge || \
              echo "::warning::Could not auto-merge $PR_URL — merge it manually."
          else
            # Strategy 2: direct push (fallback when Actions cannot create PRs).
            echo "::notice::PR creation blocked by repo settings; trying direct push."
            if git push origin HEAD:main 2>&1; then
              echo "Pushed README update to main."
            else
              echo "::warning::Could not update the README on main."
              echo "::warning::To fix: enable 'Allow GitHub Actions to create"
              echo "::warning::pull requests' in repo Settings → Actions → General,"
              echo "::warning::or manually run: scripts/bump_readme_version.py"
            fi
          fi

      # Floating major tag for the composite action (action.yml): consumers
      # write `uses: leonarduk/issue-worm@v1` (README "GitHub Action"), so
      # each release moves v1 to the commit it just released. v1 is the
      # action's interface version, deliberately independent of the 0.x
      # package version - bump ACTION_MAJOR_TAG only for a breaking change
      # to action.yml's inputs or behaviour (leonarduk/issue-worm-pro#581).
      # The tag filter above keeps this push from cutting a "v1" release,
      # and pyproject.toml's describe_command keeps setuptools-scm from
      # deriving the package version from it.
      - name: Move floating action tag
        env:
          ACTION_MAJOR_TAG: v1
        run: |
          # A patch release cut on an older line (v0.2.9 after v0.3.0 is
          # out) must not drag v1 backwards - only the newest release moves it.
          # Full vX.Y.Z only: a git glob would also admit v0.3.0-rc1, which
          # v:refname sorts above v0.3.0 by default, so releasing v0.3.0
          # would wrongly leave v1 behind.
          newest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::$GITHUB_REF_NAME is not the newest release ($newest); leaving $ACTION_MAJOR_TAG where it is."
            exit 0
          fi
          git tag --force "$ACTION_MAJOR_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$ACTION_MAJOR_TAG"
          echo "Moved $ACTION_MAJOR_TAG to $GITHUB_REF_NAME ($GITHUB_SHA)."
