name: Nightly Integration

# Runs this repo's tests against the `nightly` tag of every sibling
# package it depends on, instead of the released versions its pins name.
# The pins (and the release/update-dependencies flow that bumps them) are
# left untouched: this only answers "does main still work with what the
# upstream repos have merged today?", a day before anyone cuts a release.
#
# Scheduled an hour after nightly-tag.yml moves `nightly` in every repo.
# Each dependency is installed at the exact commit `nightly` resolved to
# (falling back to main before the upstream repo's first nightly run) and
# that commit is recorded in the job summary. A failure opens - or
# comments on - one tracking issue, which the next green run closes.
# The issue is deliberately unlabeled, so issue-worm.yml (which triggers
# on labels) never picks it up.

on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC daily, after nightly-tag.yml at 03:17
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-integration
  cancel-in-progress: false

# An explicit `shell: bash` gets -eo pipefail; the unspecified default is
# only `bash -e`, under which a failing `git ls-remote | awk` pipeline would
# pass as "no such ref" and quietly fall back to testing main.
defaults:
  run:
    shell: bash

env:
  # package=owner/repo, space separated.
  NIGHTLY_DEPS: cicaid-devtools=leonarduk/cicaid
  ISSUE_TITLE: Nightly integration against sibling repos is failing

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # --no-deps: the project install above already pulled every
      # dependency, and letting pip re-resolve would fight this repo's own
      # direct-URL pin on the same package.
      - name: Swap sibling packages for their nightly commits
        run: |
          {
            echo "### Sibling packages under test"
            echo "| Package | Ref | Commit |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for spec in $NIGHTLY_DEPS; do
            pkg="${spec%%=*}"
            url="https://github.com/${spec#*=}.git"
            ref=nightly
            sha="$(git ls-remote "$url" refs/tags/nightly 'refs/tags/nightly^{}' \
              | awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { plain = $1 } END { print (peeled != "" ? peeled : plain) }')"
            if [ -z "$sha" ]; then
              ref=main
              sha="$(git ls-remote "$url" refs/heads/main | cut -f 1)"
              echo "::warning::${spec#*=} has no nightly tag yet; testing its main instead."
            fi
            # ls-remote failing outright aborts the step (pipefail, via the
            # shell default above); this catches it succeeding with no match.
            if [ -z "$sha" ]; then
              echo "::error::Could not resolve nightly or main for ${spec#*=}."
              exit 1
            fi
            python -m pip install --force-reinstall --no-deps "$pkg @ git+$url@$sha"
            echo "| $pkg | $ref | \`${sha:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$pkg=$sha" >> "$RUNNER_TEMP/nightly-shas"
          done
          # A dependency a nightly commit added is not installed under
          # --no-deps. Fail on that - it is drift the pins need to catch up
          # with - but only when a swapped sibling is the one complaining;
          # unrelated drift in the base install just warns, so it can't open
          # a tracking issue blaming the siblings.
          if ! report="$(python -m pip check 2>&1)"; then
            echo "$report"
            names=""
            for spec in $NIGHTLY_DEPS; do
              names="${names:+$names|}$(printf '%s' "${spec%%=*}" | sed 's/[-_.]/[-_.]/g')"
            done
            if printf '%s\n' "$report" | grep -Eiq "^($names) "; then
              echo "::error::A sibling's nightly commit needs dependencies this repo's install doesn't provide (see pip check above)."
              exit 1
            fi
            echo "::warning::pip check found problems unrelated to the swapped siblings (see above)."
          fi

      # Guard against a later install step (or a future version constraint
      # in pyproject.toml) quietly replacing a sibling with a release: the
      # run must test exactly the commits recorded in the summary.
      - name: Verify the sibling commits under test
        run: |
          while IFS='=' read -r pkg sha; do
            got="$(python -c 'import json, sys; from importlib.metadata import distribution; d = distribution(sys.argv[1]).read_text("direct_url.json"); print(json.loads(d).get("vcs_info", {}).get("commit_id", "") if d else "")' "$pkg")"
            if [ "$got" != "$sha" ]; then
              echo "::error::$pkg is installed at ${got:-a non-git source}, not the commit under test ($sha)."
              exit 1
            fi
          done < "$RUNNER_TEMP/nightly-shas"

      - name: Run test suite
        run: python -m pytest

      - name: Open or update the tracking issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Plain listing, not --search: search can lag or tokenize the
          # title, and a miss here would open a duplicate issue every night.
          number="$(gh issue list --state open --limit 1000 --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"
          body="Nightly integration failed on $(date -u +%F): $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body

          This repo's tests failed against the \`nightly\` tag of its sibling packages. See the run's summary for the exact commits tested. Closed automatically by the next green nightly run."
          fi

      - name: Close the tracking issue
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Plain listing, not --search: search can lag or tokenize the
          # title, and a miss here would open a duplicate issue every night.
          number="$(gh issue list --state open --limit 1000 --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Green again: $RUN_URL"
          fi
