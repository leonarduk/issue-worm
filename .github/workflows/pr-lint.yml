name: PR Body Issue Reference Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  require-issue-reference:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request body includes issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body="${PR_BODY:-}"

          # `owner/repo#123` is accepted alongside bare `#123`: this repo is
          # the free half of an open-core split, so a fix here routinely
          # closes an issue tracked in leonarduk/issue-worm-pro and there was
          # previously no way to say so. The optional `[` lets the reference
          # sit inside a markdown link — `Fixes [owner/repo#123](url)` — which
          # is how a cross-repo reference is usually written so it stays
          # clickable.
          if printf '%s' "$body" | grep -iPq '(closes|fixes|resolves|refs|relates\s+to)\s+\[?([\w.-]+/[\w.-]+)?#\d+'; then
            echo 'PR body includes a valid issue reference.'
            exit 0
          fi

          echo 'Pull request body must include an issue reference such as Closes #123, Fixes #123, Resolves #123, Refs #123, or Relates to #123 — or the same keywords with a cross-repo reference, e.g. Closes leonarduk/issue-worm-pro#372.' >&2
          exit 1
