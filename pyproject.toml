[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-worm"
dynamic = ["version"]
description = "Local LLM issue-to-PR pipeline: GitHub issues as the queue (free shell)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # `create` shells out to the `cicaid` CLI; not a Python import, but it
    # must be on PATH for that command to work.
    "cicaid-devtools[dotenv] @ git+https://github.com/leonarduk/cicaid.git@v0.2.4",
    "python-dotenv>=1.0",
    # Direct imports in version_checker.py (the update check).
    "packaging>=24,<27",
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
issue-worm = "cli:main"

[tool.setuptools]
py-modules = ["cli", "config", "history", "version_checker", "workspace"]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
