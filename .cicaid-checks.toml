# Verifier check list for `cicaid run-ci-checks --all`.
# Mirrors .github/workflows/ci.yml's `test` and `docs-commands` jobs.
# Without this file, cicaid falls back to DEFAULT_CHECKS (allotmint's own
# CI profile), which references scripts this repo doesn't have and fails
# every build/poll run regardless of the change under test.
# The `link-check` job (lychee) isn't included here: it needs a separate
# binary not guaranteed to be on a coder's box, so it's left to CI proper.

# `--deselect ...test_core_command_reports_unavailable` matters on any box
# that also has issue-worm-pro installed editable (true for this repo's own
# dev/CI box, since building issue-worm's own issues happens from exactly
# that setup): those two parametrized cases assert issue-worm-pro is *not*
# installed, so on a box where it is, `[triage]` fires a REAL triage pass
# against the live GitHub repo and `[poll]` hangs forever with zero pytest
# output. Bare `pytest` here previously caused exactly that, twice, live.
[[checks]]
name = "test"
description = "pytest suite"
workflow = ".github/workflows/ci.yml"
commands = ["pytest --deselect tests/test_cli.py::test_core_command_reports_unavailable"]

[[checks]]
name = "docs-commands"
description = "documented commands exist in the CLI"
workflow = ".github/workflows/ci.yml"
commands = ["python scripts/check_docs_commands.py"]
