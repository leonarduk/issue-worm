name: issue-worm
description: >-
  Turn a GitHub issue into a pull request using issue-worm's free, single-pass
  engine (local Ollama, or a cloud/OpenAI-compatible endpoint via
  CODER_MODEL_SOURCE). This is a composite action, not a reusable workflow -
  it does not set `runs-on`, so the calling job chooses the runner
  (`ubuntu-latest`, a self-hosted pool, anything) with no branching in here.
author: leonarduk

inputs:
  issue:
    # Not ${{ github.event.issue.number }} here: action.yml's own string
    # fields (name/description/inputs.*.description/author) are themselves
    # evaluated as expressions if they contain the ${{ }} delimiter, and
    # `github` isn't a valid context in that evaluation - GitHub fails the
    # whole manifest load with "Unrecognized named-value: 'github'" before
    # the action ever runs. Keep this plain text; do not reintroduce it.
    description: >-
      Number of the issue to work (e.g. from a caller's
      github.event.issue.number).
    required: true
  github-token:
    description: >-
      A PAT or GitHub App installation token with `contents: write`,
      `pull-requests: write`, and `issues: read` on the target repo. A
      classic PAT's `repo` scope covers all three together; a fine-grained
      PAT needs each granted separately - `issues: read` is easy to miss
      since it isn't needed for the push/PR steps, only for fetching the
      issue body below, and this action fails there first (before either
      of the other two is ever exercised) if it's absent. Grant
      `issues: write` too (already included in a classic PAT's `repo`
      scope) for two best-effort features that silently no-op without it
      rather than failing the build: the self-heal path
      (`cli._self_heal_scope`, for an issue missing `## Implementation
      notes`) persisting its drafted section back onto the issue instead
      of only keeping it in this run's own memory, and the live progress
      comment (#345) actually being posted/edited on the issue at all -
      posting or editing any comment needs `issues: write`, not
      `issues: read`. Required - the
      built-in `secrets.GITHUB_TOKEN` is NOT enough: pull requests (and
      pushes) made with the default token deliberately do not trigger
      other workflow runs, so any CI configured to run on the PR (tests,
      review bots, required checks) would silently never fire. A PAT or
      App token does trigger them. This same token also authenticates the
      `git push` and `cicaid publish-pr` steps below and is used to fetch the
      issue body (higher rate limit; required at all for a private repo).
    required: true
  license-key:
    description: >-
      Reserved for the issue-worm-pro engine. Currently accepted and
      logged only - installing the pro wheel from a license key is not
      implemented yet (leonarduk/issue-worm-pro#584). Omit this input (or
      leave it empty) to run the free engine, which is everything this
      action does today.
    required: false
    default: ''
  close-issue:
    description: >-
      Whether the commit message and PR body carry `Closes #N`, which makes
      GitHub auto-close the issue when the PR is merged. Set to 'false' to
      keep the issue open after merge - useful when the PR only addresses
      part of the issue, or when the issue tracks broader work that
      continues after this PR. Defaults to 'true' (issues close on merge).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Report license-key status
      shell: bash
      run: |
        if [ -n "${{ inputs.license-key }}" ]; then
          echo "::notice::license-key was supplied, but the pro engine install is not implemented yet (issue-worm-pro#584) - running the free engine."
        else
          echo "license-key not supplied - running the free engine."
        fi

    - name: Check out repository
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.github-token }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install issue-worm (free engine)
      shell: bash
      # Installed from this action's own checkout (github.action_path), NOT
      # from the caller's repo at `.` - those are two different checkouts
      # when this action is consumed as `uses: leonarduk/issue-worm@v1`
      # from someone else's workflow.
      #
      # Into a fresh venv, not the runner's global/user site-packages: on a
      # persistent self-hosted runner that also has issue-worm-pro installed
      # (e.g. issue-worm-pro's own dogfood workflow, self-hosted per #580),
      # a global install would leave `pro_cli` importable, and cli.py's
      # `_try_import_pro_cli` (#352) silently delegates `issue-worm build`
      # to the full pro scheduler/Triage instead of this action's advertised
      # single-pass free engine - Triage then depends on Ollama being up on
      # that runner for a workflow that never asked for it
      # (issue-worm-pro#789). The venv's bin dir is prepended to PATH via
      # GITHUB_PATH so every later step in this composite action resolves
      # `issue-worm`/`python` here instead, regardless of what else is
      # globally installed on the runner.
      run: |
        set -euo pipefail
        venv_dir="${RUNNER_TEMP}/issue-worm-venv"
        python -m venv "$venv_dir"
        if [ -d "$venv_dir/Scripts" ]; then
          venv_bin="$venv_dir/Scripts"
        else
          venv_bin="$venv_dir/bin"
        fi
        echo "$venv_bin" >> "$GITHUB_PATH"
        "$venv_bin/python" -m pip install --upgrade pip
        "$venv_bin/python" -m pip install "${{ github.action_path }}"

    - name: Run issue-worm build
      id: build
      shell: bash
      env:
        # Read by cli.py's _fetch_issue_body for the GitHub REST call
        # (higher rate limit; required for a private repo).
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Non-interactive CI already skips the update-check prompt (stdin/
        # stdout aren't both ttys), but this makes the intent explicit.
        ISSUE_WORM_SKIP_UPDATE_CHECK: "1"
      run: |
        set -euo pipefail
        # --workspace reuses this job's own actions/checkout'd working tree
        # (already on the right repo, already credentialed for push by the
        # checkout step above) instead of having `build` re-clone the repo
        # fresh over unauthenticated HTTPS.
        issue-worm build "${{ inputs.issue }}" \
          --repo "${{ github.repository }}" \
          --workspace "${{ github.workspace }}"

    - name: Commit, push, verify, and publish the PR via cicaid
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE: ${{ inputs.issue }}
        REPO: ${{ github.repository }}
        CLOSE_ISSUE: ${{ inputs.close-issue }}
        PYTHONIOENCODING: utf-8
        # Non-interactive CI already skips it (stdin/stdout aren't both
        # ttys) - explicit here too, matching the build step, since this
        # step now also calls `issue-worm progress` several times.
        ISSUE_WORM_SKIP_UPDATE_CHECK: "1"
      run: |
        set -euo pipefail
        cd "${{ github.workspace }}"

        # #345: `build` already posted the progress comment and reported
        # its own coder stage; this step covers the two stages that run
        # out here in bash (verifier, publish) via the `issue-worm
        # progress` subcommand, ending with the terminal `**Result:**`
        # line. `_on_exit` reports a failure for every failure path below
        # in one place (a bad checkout, `cicaid publish-pr` failing, no
        # open PR found, ...) rather than needing a `--failure` call at
        # each `exit 1` - `finish()` is idempotent, so this never
        # double-reports if a later line also finishes successfully.
        # `|| true`: a progress write is best-effort and must never mask
        # the real failure this trap exists to report.
        #
        # A single EXIT trap, not two: a second `trap ... EXIT` *replaces*
        # the first in bash rather than composing with it (unlike signal
        # traps chained via `trap -p`), so the checks_log cleanup below is
        # folded into this same function instead of installing its own
        # trap - two separate `trap ... EXIT` calls would silently drop
        # whichever ran first.
        _on_exit() {
          ec=$?
          rm -f "${checks_log:-}"
          if [ "$ec" -ne 0 ]; then
            issue-worm progress --issue "$ISSUE" --repo "$REPO" \
              --failure "Action failed during commit/verify/publish (exit code $ec)" || true
          fi
        }
        trap _on_exit EXIT

        if [ -z "$(git status --porcelain)" ]; then
          echo "::error::issue-worm build reported success but left no changes to commit - nothing to open a PR for."
          exit 1
        fi

        # The title is required (it names the branch); the body only feeds
        # the PR text, so a failure there degrades instead of aborting.
        issue_title="$(gh issue view "$ISSUE" --repo "$REPO" --json title -q .title)"
        issue_body="$(gh issue view "$ISSUE" --repo "$REPO" --json body -q .body || true)"

        # cicaid's own slugify rather than a port of it, so this is exactly
        # the branch `cicaid work-on-issue` (and so the pro path) would use.
        slug="$(python -c 'import sys; from cicaid_devtools.work_on_issue import slugify; print(slugify(sys.argv[1]))' "$issue_title")"
        branch="fix/issue-${ISSUE}-${slug}"

        git config user.name "issue-worm[bot]"
        git config user.email "issue-worm[bot]@users.noreply.github.com"
        base_commit="$(git rev-parse HEAD)"
        git checkout -B "$branch"

        # Keep this run's .issue-worm/ bookkeeping out of the commit AND out
        # of publish-pr's sight: publish-pr stages everything in
        # `git diff --name-only HEAD` when the tree is dirty, which would
        # commit a tracked .issue-worm file the reset below unstaged.
        # exclude hides it untracked, skip-worktree hides it tracked.
        mkdir -p .git/info
        grep -qxF '.issue-worm/' .git/info/exclude 2>/dev/null || echo '.issue-worm/' >> .git/info/exclude
        git add -A .
        git reset -q -- .issue-worm
        git ls-files -z -- .issue-worm | xargs -0 -r git update-index --skip-worktree

        commit_args=(-m "issue-worm: apply changes for #${ISSUE}")
        if [ "$CLOSE_ISSUE" = "true" ]; then
          commit_args+=(-m "Closes #${ISSUE}")
        fi
        git commit -q "${commit_args[@]}"

        # Commit and force-push here, not in publish-pr: it refuses a branch
        # with no commits ahead of the base (checked before it commits) and
        # pushes without --force, which would break re-labelling the issue
        # as "try again" (issue-worm-pro#582). It then finds a clean,
        # already-pushed branch and only opens (or finds) the PR.
        git push -q --force -u origin "$branch"

        # Verifier stage: run the repository's own checks via cicaid. This is
        # plain free cicaid (no LLM call), so it stays within the free tier's
        # "coder is the only LLM" constraint. A pass opens a normal PR with a
        # short summary under ## Testing; a failure opens a draft PR with the
        # failing output under ## Testing (issue-worm-pro#1079).
        # Cleaned up by `_on_exit` (above) on every exit path - success, a
        # later step failure, or this script erroring out under `set -e` -
        # not just a one-off `rm -f` after the check below, which used to
        # leak this file on a `publish-pr`/`gh` failure further down.
        checks_log="$(mktemp)"
        issue-worm progress --issue "$ISSUE" --repo "$REPO" --stage-start verifier || true
        verifier_started=$SECONDS
        checks_status=0
        set +e
        cicaid run-ci-checks --all > "$checks_log" 2>&1
        checks_status=$?
        set -e
        issue-worm progress --issue "$ISSUE" --repo "$REPO" \
          --stage-done verifier --elapsed "$((SECONDS - verifier_started))" || true

        if [ "$checks_status" -eq 0 ]; then
          testing="✓ \`cicaid run-ci-checks --all\` passed."
        else
          # GitHub PR bodies cap at 65536 chars; keep the check output well
          # under that so the rest of the body (diff list, DONE line,
          # footer, Closes #N) always has headroom too.
          #
          # Truncated with `head -c` on the file directly (byte-exact, not
          # `${#var}`'s character count under a UTF-8 locale vs. byte count
          # under LC_ALL=C), then run through `iconv -c` to drop any
          # trailing bytes that got split mid-multibyte-sequence at the cut
          # point - a raw byte truncation can otherwise produce invalid
          # UTF-8, which GitHub's API rejects with a 422.
          if [ "$(wc -c < "$checks_log")" -gt 40000 ]; then
            checks_output="$(head -c 40000 "$checks_log" | iconv -f utf-8 -t utf-8 -c)"$'\n... (truncated)'
          else
            checks_output="$(cat "$checks_log")"
          fi
          testing="$(printf '✗ `cicaid run-ci-checks --all` failed.\n\n<details><summary>Check output</summary>\n\n```\n%s\n```\n\n</details>' "$checks_output")"
        fi

        changed_files="$(git diff --name-only "$base_commit" HEAD | sed 's/^/- /')"

        # Extract the DONE: line from the issue's ## Implementation notes
        # section (same scoping as review.py).
        notes_section="$(printf '%s\n' "$issue_body" | awk '
          /^##([^#]|$)/ {
            heading = $0
            sub(/^##[ \t]*/, "", heading)
            sub(/[ \t]*$/, "", heading)
            if (!found && tolower(heading) == "implementation notes") { f = 1; found = 1 }
            else { f = 0 }
            next
          }
          f { print }
        ')"
        done_line="$(printf '%s\n' "$notes_section" | { grep -m1 -i '^DONE:' || true; } | sed -E 's/^DONE:[[:space:]]*//I')"

        # Why: the issue text outside ## Implementation notes, capped at
        # 500 characters so the PR body stays readable.
        why_excerpt="$(printf '%s\n' "$issue_body" | awk '
          /^##([^#]|$)/ {
            heading = $0
            sub(/^##[ \t]*/, "", heading)
            sub(/[ \t]*$/, "", heading)
            if (tolower(heading) == "implementation notes") { f = 1 } else { f = 0 }
            next
          }
          !f { print }
        ')"
        if [ "${#why_excerpt}" -gt 500 ]; then
          why_excerpt="${why_excerpt:0:500}..."
        fi
        if [ -z "$why_excerpt" ]; then
          why_excerpt="See #${ISSUE}."
        fi

        what_section=""
        if [ -n "$done_line" ]; then
          what_section="$done_line"
        fi
        if [ -n "$changed_files" ]; then
          if [ -n "$what_section" ]; then
            what_section="$what_section"$'\n\n'"**Files changed:**"$'\n'"$changed_files"
          else
            what_section="**Files changed:**"$'\n'"$changed_files"
          fi
        fi
        if [ -z "$what_section" ]; then
          what_section="No goal line or changed files detected."
        fi

        approach="Single-pass free-engine build: the coder applied the change and the Action published it without an LLM-generated summary."

        # Logo footer, matching issue-worm-pro's scheduler._pr_footer().
        pr_footer="$(printf '\n\n---\n<p align="center"><img src="https://github.com/leonarduk/issue-worm/raw/main/docs/logo.jpg" width="48" alt="issue-worm logo" /><br/><sub>🐛 Opened automatically by <a href="https://github.com/leonarduk/issue-worm">issue-worm</a></sub></p>')"

        pr_body="$(printf '## What\n%s\n\n## Why\n%s\n\n## Approach\n%s\n\n## Testing\n%s\n\n## Checklist\n- [ ] Tests added/updated\n- [ ] Docs updated if needed\n- [ ] No breaking changes\n%s' \
          "$what_section" "$why_excerpt" "$approach" "$testing" "$pr_footer")"

        body_file="$(mktemp)"
        trap 'rm -f "$body_file"' EXIT
        printf '%s\n' "$pr_body" > "$body_file"

        issue-worm progress --issue "$ISSUE" --repo "$REPO" --stage-start publish || true
        publish_started=$SECONDS

        # --body-file skips publish-pr's LLM body generation entirely (no
        # LLM outside the coder). It titles the PR `[Issue #N] <title>`,
        # appends `Closes #N` to the body, and returns an already-open PR
        # for this branch instead of opening a second one. --draft is
        # passed only when the verifier failed.
        if [ "$checks_status" -eq 0 ]; then
          cicaid publish-pr --body-file "$body_file"
        else
          cicaid publish-pr --draft --body-file "$body_file"
        fi

        # REST, not `gh pr view`/`gh pr edit`: their GraphQL queries need
        # read:org, which a repo-scoped PAT doesn't have.
        pr_number="$(gh api -X GET "repos/$REPO/pulls" -f head="${REPO%%/*}:$branch" -f state=open -q '.[0].number')"
        if [ -z "$pr_number" ]; then
          echo "::error::cicaid publish-pr succeeded but no open PR was found for $branch."
          exit 1
        fi
        issue-worm progress --issue "$ISSUE" --repo "$REPO" \
          --stage-done publish --elapsed "$((SECONDS - publish_started))" || true

        # publish-pr always appends `Closes #N`; strip it again when the
        # caller asked for the issue to stay open after merge.
        if [ "$CLOSE_ISSUE" != "true" ]; then
          gh api "repos/$REPO/pulls/$pr_number" -q .body | { grep -vxF "Closes #${ISSUE}" || true; } > "$body_file"
          gh api -X PATCH "repos/$REPO/pulls/$pr_number" -F body=@"$body_file" > /dev/null
        fi

        # Pro's PR_AUTHOR_LABEL. Labelling a PR fires `pull_request:
        # labeled`, not `issues: labeled`, so this can't re-trigger a
        # label-gated issue-worm workflow. Cosmetic, so never fatal.
        gh api -X POST "repos/$REPO/issues/$pr_number/labels" -f 'labels[]=issue-worm' > /dev/null \
          || echo "::warning::Could not add the issue-worm label to PR #$pr_number."

        # Terminal record (#345): a PR was opened either way (draft on a
        # failed verifier, per issue-worm-pro#1079's chosen "always
        # publish, mark draft on failure" behaviour) - `**Result:**` links
        # to it regardless of `checks_status`, since a draft PR still is
        # this run's result. The EXIT trap above never fires a competing
        # `--failure` here: it only reports on a nonzero exit, and finish()
        # is idempotent besides.
        issue-worm progress --issue "$ISSUE" --repo "$REPO" \
          --pr-url "https://github.com/$REPO/pull/$pr_number" || true
