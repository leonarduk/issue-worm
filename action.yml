name: issue-worm
description: >-
  Turn a GitHub issue into a pull request using issue-worm's free, single-pass
  engine (local Ollama, or a cloud/OpenAI-compatible endpoint via
  CODER_MODEL_SOURCE). This is a composite action, not a reusable workflow -
  it does not set `runs-on`, so the calling job chooses the runner
  (`ubuntu-latest`, a self-hosted pool, anything) with no branching in here.
author: leonarduk

inputs:
  issue:
    # Not ${{ github.event.issue.number }} here: action.yml's own string
    # fields (name/description/inputs.*.description/author) are themselves
    # evaluated as expressions if they contain the ${{ }} delimiter, and
    # `github` isn't a valid context in that evaluation - GitHub fails the
    # whole manifest load with "Unrecognized named-value: 'github'" before
    # the action ever runs. Keep this plain text; do not reintroduce it.
    description: >-
      Number of the issue to work (e.g. from a caller's
      github.event.issue.number).
    required: true
  github-token:
    description: >-
      A PAT or GitHub App installation token with `contents: write`,
      `pull-requests: write`, and `issues: read` on the target repo. A
      classic PAT's `repo` scope covers all three together; a fine-grained
      PAT needs each granted separately - `issues: read` is easy to miss
      since it isn't needed for the push/PR steps, only for fetching the
      issue body below, and this action fails there first (before either
      of the other two is ever exercised) if it's absent. Grant
      `issues: write` too (already included in a classic PAT's `repo`
      scope) if you want the self-heal path (`cli._self_heal_scope`, for
      an issue missing `## Implementation notes`) to persist its drafted
      section back onto the issue - without it, self-heal still lets the
      build proceed, it just can't save the draft anywhere but this run's
      own memory. Required - the
      built-in `secrets.GITHUB_TOKEN` is NOT enough: pull requests (and
      pushes) made with the default token deliberately do not trigger
      other workflow runs, so any CI configured to run on the PR (tests,
      review bots, required checks) would silently never fire. A PAT or
      App token does trigger them. This same token also authenticates the
      `git push` and `gh pr create` steps below and is used to fetch the
      issue body (higher rate limit; required at all for a private repo).
    required: true
  license-key:
    description: >-
      Reserved for the issue-worm-pro engine. Currently accepted and
      logged only - installing the pro wheel from a license key is not
      implemented yet (leonarduk/issue-worm-pro#584). Omit this input (or
      leave it empty) to run the free engine, which is everything this
      action does today.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Report license-key status
      shell: bash
      run: |
        if [ -n "${{ inputs.license-key }}" ]; then
          echo "::notice::license-key was supplied, but the pro engine install is not implemented yet (issue-worm-pro#584) - running the free engine."
        else
          echo "license-key not supplied - running the free engine."
        fi

    - name: Check out repository
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.github-token }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install issue-worm (free engine)
      shell: bash
      # Installed from this action's own checkout (github.action_path), NOT
      # from the caller's repo at `.` - those are two different checkouts
      # when this action is consumed as `uses: leonarduk/issue-worm@v1`
      # from someone else's workflow.
      run: python -m pip install --upgrade pip && python -m pip install "${{ github.action_path }}"

    - name: Run issue-worm build
      id: build
      shell: bash
      env:
        # Read by cli.py's _fetch_issue_body for the GitHub REST call
        # (higher rate limit; required for a private repo).
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Non-interactive CI already skips the update-check prompt (stdin/
        # stdout aren't both ttys), but this makes the intent explicit.
        ISSUE_WORM_SKIP_UPDATE_CHECK: "1"
      run: |
        set -euo pipefail
        # --workspace reuses this job's own actions/checkout'd working tree
        # (already on the right repo, already credentialed for push by the
        # checkout step above) instead of having `build` re-clone the repo
        # fresh over unauthenticated HTTPS.
        issue-worm build "${{ inputs.issue }}" \
          --repo "${{ github.repository }}" \
          --workspace "${{ github.workspace }}"

    - name: Commit, push, and open the PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        cd "${{ github.workspace }}"

        if [ -z "$(git status --porcelain)" ]; then
          echo "::error::issue-worm build reported success but left no changes to commit - nothing to open a PR for."
          exit 1
        fi

        # Deterministic per-issue branch name so that re-labelling the
        # issue (issue-worm-pro#582's "remove-and-re-add means try again"
        # UX) supersedes the previous attempt instead of piling up
        # branches - hence --force below, always overwriting this branch.
        branch="issue-worm/issue-${{ inputs.issue }}"
        git config user.name "issue-worm[bot]"
        git config user.email "issue-worm[bot]@users.noreply.github.com"
        git checkout -b "$branch"
        # Excludes .issue-worm/ (this run's own bookkeeping - history.jsonl,
        # the in-flight registry): it's meaningful only for this one
        # ephemeral job, not the consumer's source tree, and a repo that
        # has never used issue-worm before has no reason to already
        # gitignore it - every commit from a first-time adopter would
        # otherwise carry an ever-growing, meaningless JSONL file into
        # their history (leonarduk/cicaid#36).
        #
        # Plain `git add -A .` plus an explicit `git reset -- .issue-worm`
        # afterward, NOT `git add -A -- . ':!.issue-worm'` (issue #270):
        # that pathspec-negation form dies with "The following paths are
        # ignored by one of your .gitignore files" and exit 1 whenever
        # .issue-worm *is* already gitignored - which is true for this
        # action's own two home repos (issue-worm, issue-worm-pro) that
        # dogfood it on themselves. `git add -A .` never errors on ignored
        # paths regardless of whether they're gitignored yet, so it
        # handles both a fresh consumer repo (nothing gitignored: adds
        # everything, then the reset below unstages just .issue-worm) and
        # a dogfooding repo (already gitignored: -A skips it, and the
        # reset is then a harmless no-op) with the same two commands.
        # `git reset -- .issue-worm` also no-ops cleanly (exit 0) when the
        # path doesn't exist at all - verified locally, since `set -e`
        # above would otherwise abort the step on a nonexistent pathspec.
        # If a consumer has `.issue-worm` *tracked* (committed by an older
        # version of this action, before it was gitignored), this reset
        # will unstage its changes along with everything else here - a
        # deliberate tradeoff, since untracking it is the point.
        git add -A .
        git reset -- .issue-worm
        git commit -m "issue-worm: apply changes for #${{ inputs.issue }}" -m "Closes #${{ inputs.issue }}"
        git push --force origin "$branch"

        # A retry (branch already had an open PR) just needed the push
        # above to update it - creating a second PR for the same head
        # branch would fail, so only open one if none exists yet.
        if gh pr view "$branch" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "PR for $branch already exists - pushed update, nothing more to do."
        else
          issue_title="$(gh issue view "${{ inputs.issue }}" --repo "${{ github.repository }}" --json title -q .title)"
          gh pr create \
            --repo "${{ github.repository }}" \
            --head "$branch" \
            --title "issue-worm: ${issue_title:-issue #${{ inputs.issue }}}" \
            --body "$(printf 'Automated single-pass change from the free issue-worm engine.\n\nCloses #%s' "${{ inputs.issue }}")"
        fi
